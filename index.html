<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carro na Cidade</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #071722;
        }

        /* ==================================
           CENÁRIO
        ================================== */

        .cena {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;
        }


        /* ==================================
           BACKGROUND DA CIDADE
        ================================== */

        .background {
            position: absolute;

            top: 0;
            left: 0;

            width: 200%;
            height: 100%;

            /*
            A imagem da cidade fica repetida
            horizontalmente.
            */

            background-image: url("bg.jpg");

            background-repeat: repeat-x;

            background-size: auto 100%;

            background-position: 0 0;

            animation:
                cidade 20s linear infinite;

            z-index: 1;
        }


        /* Movimento SOMENTE da cidade */

        @keyframes cidade {

            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }

        }


        /* ==================================
           CARRO
        ================================== */

        .carro {

            position: absolute;

            /*
            CARRO FIXO
            */

            left: 50%;

            bottom: 20%;

            width: 420px;

            transform: translateX(-50%);

            z-index: 5;

            filter:
                drop-shadow(
                    0 12px 8px
                    rgba(0,0,0,.45)
                );
        }


        /* ==================================
           MOTOCICLETA
        ================================== */

        .moto {

            position: absolute;

            /*
            MOTO FIXA
            */

            left: 50%;

            bottom: 4%;

            width: 380px;

            transform: translateX(-50%);

            z-index: 6;

            filter:
                drop-shadow(
                    0 12px 8px
                    rgba(0,0,0,.45)
                );
        }


        /* ==================================
           TÍTULO
        ================================== */

        .titulo {

            position: absolute;

            top: 30px;
            left: 50%;

            transform:
                translateX(-50%);

            z-index: 10;

            color: white;

            text-align: center;

            text-shadow:
                0 3px 10px
                rgba(0,0,0,.7);
        }


        .titulo h1 {

            font-family: Arial, sans-serif;

            font-size:
                clamp(
                    25px,
                    4vw,
                    50px
                );

            margin-bottom: 8px;
        }


        .titulo p {

            font-family: Arial, sans-serif;

            font-size: 18px;

            opacity: .9;
        }


        /* ==================================
           CONTROLE
        ================================== */

        .controles {

            position: absolute;

            bottom: 25px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 20;
        }


        button {

            border: none;

            padding:
                12px 24px;

            border-radius: 8px;

            background: #e94f5f;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background: #ff6575;

        }


        /* ==================================
           PAUSAR
        ================================== */

        .pausado .background {

            animation-play-state:
                paused;
        }


        /* ==================================
           RESPONSIVO
        ================================== */

        @media (max-width: 700px) {

            .background {

                background-size:
                    auto 100%;
            }


            .carro {

                width: 70vw;

                bottom: 21%;
            }


            .moto {

                width: 65vw;

                bottom: 5%;
            }


            .titulo {

                top: 20px;
            }

        }

    </style>

</head>


<body>


    <div class="cena">


        <!-- ==================================
             CIDADE EM MOVIMENTO
        ================================== -->

        <div class="background"></div>


        <!-- ==================================
             CARRO PARADO
        ================================== -->

        <img
            src="car.png"
            class="carro"
            alt="Carro"
        >


        <!-- ==================================
             MOTO PARADA
        ================================== -->

        <img
            src="motobike.png"
            class="moto"
            alt="Motocicleta"
        >


        <!-- ==================================
             TEXTO
        ================================== -->

        <div class="titulo">

            <h1>
                Uma noite na cidade
            </h1>

            <p>
                🚗 🏍️
            </p>

        </div>


        <!-- ==================================
             BOTÃO
        ================================== -->

        <div class="controles">

            <button onclick="pausar()">
                Pausar cidade
            </button>

        </div>


    </div>


    <script>

        function pausar() {

            const cena =
                document.querySelector(".cena");

            cena.classList.toggle("pausado");

            const botao =
                document.querySelector("button");


            if (
                cena.classList.contains("pausado")
            ) {

                botao.textContent =
                    "Continuar cidade";

            } else {

                botao.textContent =
                    "Pausar cidade";

            }

        }

    </script>


</body>

</html>
