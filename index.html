<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>City Drive</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {
            overflow: hidden;
            background: #071722;
            font-family: Arial, sans-serif;
        }


        /* =====================================
           CENA
        ===================================== */

        .cena {

            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;
        }


        /* =====================================
           BACKGROUND DA CIDADE
        ===================================== */

        .background {

            position: absolute;

            inset: 0;

            width: 200%;
            height: 100%;

            background-image:
                url("bg.jpg");

            background-repeat: repeat-x;

            background-size:
                auto 100%;

            background-position:
                left center;

            animation:
                cidadeMovimento
                18s
                linear
                infinite;

            z-index: 1;
        }


        @keyframes cidadeMovimento {

            from {
                transform:
                    translateX(0);
            }

            to {
                transform:
                    translateX(-50%);
            }

        }


        /* =====================================
           ESCURECIMENTO
        ===================================== */

        .overlay {

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,.05),
                    rgba(0,0,0,.18)
                );

            z-index: 2;

            pointer-events: none;
        }


        /* =====================================
           ESTRADA
        ===================================== */

        .estrada {

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 38%;

            background:
                linear-gradient(
                    to bottom,
                    #354950,
                    #17262d 45%,
                    #0b151b 100%
                );

            z-index: 3;

            /*
                Perspectiva leve da estrada
            */

            clip-path:
                polygon(
                    0 8%,
                    100% 8%,
                    100% 100%,
                    0 100%
                );
        }


        /* =====================================
           FAIXA DO CARRO
        ===================================== */

        .faixa-carro {

            position: absolute;

            left: 0;

            top: 45%;

            width: 100%;

            height: 5px;

            background:
                repeating-linear-gradient(
                    to right,
                    transparent 0px,
                    transparent 90px,
                    rgba(255,255,255,.9) 90px,
                    rgba(255,255,255,.9) 150px,
                    transparent 150px,
                    transparent 250px
                );

            animation:
                faixaMovimento
                .8s
                linear
                infinite;

            opacity: .75;
        }


        /* =====================================
           FAIXA DA MOTO
        ===================================== */

        .faixa-moto {

            position: absolute;

            left: 0;

            top: 70%;

            width: 100%;

            height: 5px;

            background:
                repeating-linear-gradient(
                    to right,
                    transparent 0px,
                    transparent 90px,
                    rgba(255,255,255,.9) 90px,
                    rgba(255,255,255,.9) 150px,
                    transparent 150px,
                    transparent 250px
                );

            animation:
                faixaMovimento
                .8s
                linear
                infinite;

            opacity: .75;
        }


        @keyframes faixaMovimento {

            from {
                background-position:
                    0 0;
            }

            to {
                background-position:
                    -250px 0;
            }

        }


        /* =====================================
           LINHA CENTRAL
        ===================================== */

        .linha-central {

            position: absolute;

            left: 0;

            top: 57%;

            width: 100%;

            height: 4px;

            background:
                rgba(255, 214, 60, .9);

            box-shadow:
                0 0 5px
                rgba(255,214,60,.4);

            z-index: 4;
        }


        /* =====================================
           CARRO
           
           FAIXA PRÓPRIA
           MAIS À FRENTE
        ===================================== */

        .carro {

            position: absolute;

            width: 400px;

            /*
                FAIXA DO CARRO
            */

            left: 65%;

            /*
                MAIS PRÓXIMO
            */

            bottom: 9%;

            transform:
                translateX(-50%);

            z-index: 8;

            filter:
                drop-shadow(
                    0 15px 10px
                    rgba(0,0,0,.5)
                );
        }


        /* =====================================
           MOTO
           
           OUTRA FAIXA
           MAIS ATRÁS
        ===================================== */

        .moto {

            position: absolute;

            width: 270px;

            /*
                OUTRA FAIXA
            */

            left: 35%;

            /*
                MAIS DISTANTE
            */

            bottom: 22%;

            transform:
                translateX(-50%);

            z-index: 7;

            filter:
                drop-shadow(
                    0 12px 8px
                    rgba(0,0,0,.5)
                );
        }


        /* =====================================
           TÍTULO
        ===================================== */

        .titulo {

            position: absolute;

            top: 30px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 15;

            color: white;

            text-align: center;

            text-shadow:
                0 3px 12px
                rgba(0,0,0,.8);

            pointer-events: none;
        }


        .titulo h1 {

            font-size:
                clamp(
                    25px,
                    4vw,
                    50px
                );
        }


        .titulo p {

            margin-top: 8px;

            font-size: 17px;

            opacity: .9;
        }


        /* =====================================
           CONTROLES
        ===================================== */

        .controles {

            position: absolute;

            bottom: 20px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 20;
        }


        button {

            padding:
                12px 24px;

            border: none;

            border-radius: 8px;

            background: #e84f60;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background: #ff6977;
        }


        /* =====================================
           PAUSAR
        ===================================== */

        .pausado .background,
        .pausado .faixa-carro,
        .pausado .faixa-moto {

            animation-play-state:
                paused;
        }


        /* =====================================
           RESPONSIVO
        ===================================== */

        @media (max-width: 700px) {

            .carro {

                width: 58vw;

                left: 67%;

                bottom: 8%;
            }


            .moto {

                width: 42vw;

                left: 32%;

                bottom: 21%;
            }


            .linha-central {

                top: 57%;
            }


            .titulo {

                top: 20px;

                width: 90%;
            }

        }

    </style>

</head>


<body>


    <main class="cena">


        <!-- =================================
             CIDADE EM MOVIMENTO
        ================================== -->

        <div
            class="background">
        </div>


        <!-- =================================
             ESCURECIMENTO
        ================================== -->

        <div
            class="overlay">
        </div>


        <!-- =================================
             ESTRADA
        ================================== -->

        <div class="estrada">


            <!-- FAIXA DO CARRO -->

            <div
                class="faixa-carro">
            </div>


            <!-- LINHA QUE SEPARA AS FAIXAS -->

            <div
                class="linha-central">
            </div>


            <!-- FAIXA DA MOTO -->

            <div
                class="faixa-moto">
            </div>


        </div>


        <!-- =================================
             MOTO
             
             FAIXA DE TRÁS
        ================================== -->

        <img
            src="motobike.png"
            class="moto"
            alt="Motocicleta">


        <!-- =================================
             CARRO
             
             FAIXA DA FRENTE
        ================================== -->

        <img
            src="car.png"
            class="carro"
            alt="Carro">


        <!-- =================================
             TÍTULO
        ================================== -->

        <div class="titulo">

            <h1>
                Uma Noite na Cidade
            </h1>

            <p>
                City Drive
            </p>

        </div>


        <!-- =================================
             CONTROLE
        ================================== -->

        <div class="controles">

            <button id="botao">

                Pausar

            </button>

        </div>


    </main>


    <script>

        const cena =
            document.querySelector(".cena");

        const botao =
            document.querySelector("#botao");


        botao.addEventListener(
            "click",
            function () {

                cena.classList.toggle(
                    "pausado"
                );


                if (
                    cena.classList.contains(
                        "pausado"
                    )
                ) {

                    botao.textContent =
                        "Continuar";

                } else {

                    botao.textContent =
                        "Pausar";

                }

            }
        );

    </script>


</body>

</html>
