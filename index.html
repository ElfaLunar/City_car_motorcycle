<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>City Drive</title>

    <style>

        /* =========================================
           CONFIGURAÇÃO GERAL
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background: #071722;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================================
           CENA PRINCIPAL
        ========================================= */

        .cena {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;
        }


        /* =========================================
           BACKGROUND DA CIDADE
           
           SOMENTE ELE SE MOVIMENTA
        ========================================= */

        .cidade {
            position: absolute;

            top: 0;
            left: 0;

            width: 200%;
            height: 100%;

            background-image: url("bg.jpg");

            background-repeat: repeat-x;

            /*
                A imagem ocupa toda a altura.
                Como a div tem 200%, conseguimos
                criar um loop horizontal.
            */
            background-size: auto 100%;

            background-position: 0 center;

            animation:
                cidadeAndando
                18s
                linear
                infinite;

            z-index: 1;
        }


        /* =========================================
           MOVIMENTO DO BACKGROUND
        ========================================= */

        @keyframes cidadeAndando {

            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }

        }


        /* =========================================
           ESCURECIMENTO
        ========================================= */

        .overlay {

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.05),
                    rgba(0, 0, 0, 0.15)
                );

            z-index: 2;

            pointer-events: none;
        }


        /* =========================================
           ESTRADA
        ========================================= */

        .estrada {

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 38%;

            /*
                A estrada fica parada.
                Apenas as faixas se movimentam.
            */

            background:
                linear-gradient(
                    to bottom,
                    #293b44 0%,
                    #17262e 45%,
                    #0b151c 100%
                );

            border-top:
                3px solid
                rgba(120, 177, 194, 0.6);

            z-index: 3;
        }


        /* =========================================
           FAIXAS DA ESTRADA
        ========================================= */

        .estrada::before {

            content: "";

            position: absolute;

            top: 55%;
            left: 0;

            width: 100%;
            height: 7px;

            background:
                repeating-linear-gradient(
                    to right,
                    #ffffff 0px,
                    #ffffff 110px,
                    transparent 110px,
                    transparent 210px
                );

            animation:
                faixaMovimento
                0.7s
                linear
                infinite;

            opacity: 0.8;
        }


        @keyframes faixaMovimento {

            from {
                background-position: 0 0;
            }

            to {
                background-position: -210px 0;
            }

        }


        /* =========================================
           LUZES DA ESTRADA
        ========================================= */

        .estrada::after {

            content: "";

            position: absolute;

            left: 0;
            top: 18%;

            width: 100%;
            height: 3px;

            background:
                repeating-linear-gradient(
                    to right,
                    transparent 0px,
                    transparent 80px,
                    rgba(82, 176, 211, 0.8) 80px,
                    rgba(82, 176, 211, 0.8) 100px,
                    transparent 100px,
                    transparent 180px
                );

            animation:
                luzesMovimento
                1.2s
                linear
                infinite;

            opacity: 0.5;
        }


        @keyframes luzesMovimento {

            from {
                background-position: 0 0;
            }

            to {
                background-position: -180px 0;
            }

        }


        /* =========================================
           CARRO
           
           FICA PARADO
        ========================================= */

        .carro {

            position: absolute;

            /*
                POSIÇÃO DO CARRO
            */

            left: 58%;
            bottom: 19%;

            width: 420px;

            height: auto;

            transform:
                translateX(-50%);

            /*
                IMPORTANTE:
                NÃO possui animation.
            */

            z-index: 6;

            filter:
                drop-shadow(
                    0 15px 10px
                    rgba(0, 0, 0, 0.45)
                );
        }


        /* =========================================
           MOTOCICLETA
           
           FICA ATRÁS DO CARRO
        ========================================= */

        .moto {

            position: absolute;

            /*
                A moto fica atrás,
                mais para a esquerda.
            */

            left: 30%;
            bottom: 7%;

            width: 350px;

            height: auto;

            transform:
                translateX(-50%);

            /*
                Também NÃO possui animation.
            */

            z-index: 7;

            filter:
                drop-shadow(
                    0 15px 10px
                    rgba(0, 0, 0, 0.5)
                );
        }


        /* =========================================
           TÍTULO
        ========================================= */

        .titulo {

            position: absolute;

            top: 35px;
            left: 50%;

            transform:
                translateX(-50%);

            z-index: 10;

            color: white;

            text-align: center;

            text-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.8);

            pointer-events: none;
        }


        .titulo h1 {

            font-size:
                clamp(
                    26px,
                    4vw,
                    52px
                );

            font-weight: 800;

            letter-spacing: 1px;
        }


        .titulo p {

            margin-top: 8px;

            font-size:
                clamp(
                    13px,
                    1.5vw,
                    19px
                );

            opacity: 0.9;
        }


        /* =========================================
           CONTROLES
        ========================================= */

        .controles {

            position: absolute;

            left: 50%;
            bottom: 25px;

            transform:
                translateX(-50%);

            z-index: 20;

            display: flex;

            gap: 10px;
        }


        button {

            border: none;

            padding:
                12px 22px;

            border-radius: 9px;

            color: white;

            background: #e84f60;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s,
                background 0.2s;
        }


        button:hover {

            background: #ff6675;

            transform:
                translateY(-2px);
        }


        /* =========================================
           BOTÃO REINICIAR
        ========================================= */

        #reiniciar {

            background: #167fa3;
        }


        #reiniciar:hover {

            background: #2199bd;
        }


        /* =========================================
           PAUSAR SOMENTE O BACKGROUND
        ========================================= */

        .pausado .cidade {

            animation-play-state:
                paused;
        }


        .pausado .estrada::before,
        .pausado .estrada::after {

            animation-play-state:
                paused;
        }


        /* =========================================
           RESPONSIVO
        ========================================= */

        @media (max-width: 900px) {

            .carro {

                width: 48vw;

                left: 58%;

                bottom: 19%;
            }


            .moto {

                width: 40vw;

                left: 28%;

                bottom: 7%;
            }

        }


        @media (max-width: 600px) {

            .cidade {

                background-size:
                    auto 100%;
            }


            .estrada {

                height: 40%;
            }


            .carro {

                width: 62vw;

                left: 60%;

                bottom: 21%;
            }


            .moto {

                width: 52vw;

                left: 27%;

                bottom: 7%;
            }


            .titulo {

                top: 20px;

                width: 90%;
            }


            .controles {

                bottom: 15px;
            }


            button {

                padding:
                    10px 15px;

                font-size: 13px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         CENA
    ========================================= -->

    <main class="cena">


        <!-- CIDADE QUE SE MOVIMENTA -->

        <div
            class="cidade"
            id="cidade">
        </div>


        <!-- ESCURECIMENTO -->

        <div
            class="overlay">
        </div>


        <!-- ESTRADA -->

        <div
            class="estrada">
        </div>


        <!-- =====================================
             MOTOCICLETA
             
             FIXA ATRÁS
        ====================================== -->

        <img
            src="motobike.png"
            class="moto"
            alt="Motocicleta">


        <!-- =====================================
             CARRO
             
             FIXO NA FRENTE
        ====================================== -->

        <img
            src="car.png"
            class="carro"
            alt="Carro">


        <!-- =====================================
             TÍTULO
        ====================================== -->

        <div class="titulo">

            <h1>
                Uma Noite na Cidade
            </h1>

            <p>
                A cidade está em movimento
            </p>

        </div>


        <!-- =====================================
             CONTROLES
        ====================================== -->

        <div class="controles">

            <button
                id="pausar">

                Pausar

            </button>


            <button
                id="reiniciar">

                Reiniciar

            </button>

        </div>


    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        const cena =
            document.querySelector(".cena");

        const cidade =
            document.querySelector(".cidade");

        const estrada =
            document.querySelector(".estrada");

        const botaoPausar =
            document.querySelector("#pausar");

        const botaoReiniciar =
            document.querySelector("#reiniciar");


        /* =====================================
           PAUSAR / CONTINUAR
        ===================================== */

        botaoPausar.addEventListener(
            "click",
            function () {

                cena.classList.toggle("pausado");


                if (
                    cena.classList.contains("pausado")
                ) {

                    botaoPausar.textContent =
                        "Continuar";

                } else {

                    botaoPausar.textContent =
                        "Pausar";

                }

            }
        );


        /* =====================================
           REINICIAR BACKGROUND
        ===================================== */

        botaoReiniciar.addEventListener(
            "click",
            function () {

                cena.classList.remove(
                    "pausado"
                );

                botaoPausar.textContent =
                    "Pausar";


                /*
                    Reinicia a animação
                    do background.
                */

                cidade.style.animation =
                    "none";

                estrada.style.animation =
                    "none";


                /*
                    Força o navegador
                    a recalcular.
                */

                void cidade.offsetWidth;


                /*
                    Volta a animação.
                */

                cidade.style.animation =
                    "cidadeAndando 18s linear infinite";

            }
        );

    </script>


</body>

</html>
