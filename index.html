<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carro e Moto na Cidade</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background: #071722;
            font-family: Arial, sans-serif;
        }


        /* =========================================
           CENA
        ========================================= */

        .cena {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;
        }


        /* =========================================
           BACKGROUND DA CIDADE
        ========================================= */

        .cidade {
            position: absolute;

            top: 0;
            left: 0;

            width: 200%;
            height: 100%;

            background-image: url("bg.jpg");

            background-repeat: repeat-x;

            background-size: auto 100%;

            background-position: left center;

            animation:
                cidadeMovimento
                15s
                linear
                infinite;

            z-index: 1;
        }


        @keyframes cidadeMovimento {

            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }

        }


        /* =========================================
           ESTRADA
        ========================================= */

        .estrada {

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 38%;

            background:
                linear-gradient(
                    to bottom,
                    #34474f,
                    #111d23
                );

            z-index: 2;
        }


        /* =========================================
           LINHA CENTRAL ENTRE AS DUAS FAIXAS
        ========================================= */

        .linha-central {

            position: absolute;

            left: 0;
            top: 48%;

            width: 100%;
            height: 6px;

            background:
                repeating-linear-gradient(
                    to right,
                    #ffffff 0,
                    #ffffff 90px,
                    transparent 90px,
                    transparent 180px
                );

            animation:
                linhaMovimento
                .8s
                linear
                infinite;

            opacity: .8;
        }


        @keyframes linhaMovimento {

            from {
                background-position: 0;
            }

            to {
                background-position: -180px;
            }

        }


        /* =========================================
           LINHA LATERAL
        ========================================= */

        .linha-lateral {

            position: absolute;

            left: 0;
            top: 5%;

            width: 100%;
            height: 4px;

            background: #d6d6d6;

            opacity: .5;
        }


        /* =========================================
           CARRO
           
           FAIXA 1
        ========================================= */

        .carro {

            position: absolute;

            width: 420px;

            /*
                CARRO FICA NA FAIXA DE CIMA
            */

            left: 58%;

            bottom: 18%;

            transform:
                translateX(-50%);

            z-index: 6;

            filter:
                drop-shadow(
                    0 15px 10px
                    rgba(0,0,0,.5)
                );
        }


        /* =========================================
           MOTO
           
           FAIXA 2
        ========================================= */

        .moto {

            position: absolute;

            width: 340px;

            /*
                MOTO FICA NA OUTRA FAIXA
            */

            left: 58%;

            bottom: 4%;

            transform:
                translateX(-50%);

            z-index: 7;

            filter:
                drop-shadow(
                    0 15px 10px
                    rgba(0,0,0,.5)
                );
        }


        /* =========================================
           TÍTULO
        ========================================= */

        .titulo {

            position: absolute;

            top: 30px;
            left: 50%;

            transform:
                translateX(-50%);

            z-index: 10;

            color: white;

            text-align: center;

            text-shadow:
                0 3px 12px
                rgba(0,0,0,.8);
        }


        .titulo h1 {

            font-size:
                clamp(
                    26px,
                    4vw,
                    50px
                );
        }


        .titulo p {

            margin-top: 8px;

            font-size: 17px;

            opacity: .9;
        }


        /* =========================================
           CONTROLES
        ========================================= */

        .controles {

            position: absolute;

            left: 50%;
            bottom: 20px;

            transform:
                translateX(-50%);

            z-index: 20;
        }


        button {

            border: none;

            padding:
                12px 24px;

            border-radius: 8px;

            background: #e84f60;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background: #ff6675;
        }


        /* =========================================
           PAUSAR
        ========================================= */

        .pausado .cidade,
        .pausado .linha-central {

            animation-play-state:
                paused;
        }


        /* =========================================
           CELULAR
        ========================================= */

        @media (max-width: 700px) {

            .carro {

                width: 58vw;

                left: 58%;

                bottom: 18%;
            }


            .moto {

                width: 48vw;

                left: 58%;

                bottom: 4%;
            }


            .titulo {

                top: 20px;

                width: 90%;
            }

        }

    </style>

</head>


<body>


    <main class="cena">


        <!-- =====================================
             CIDADE EM MOVIMENTO
        ====================================== -->

        <div
            class="cidade">
        </div>


        <!-- =====================================
             ESTRADA
        ====================================== -->

        <div
            class="estrada">

            <!-- linha que separa as faixas -->

            <div
                class="linha-central">
            </div>

            <div
                class="linha-lateral">
            </div>

        </div>


        <!-- =====================================
             CARRO
             
             FAIXA 1
        ====================================== -->

        <img
            src="car.png"
            class="carro"
            alt="Carro">


        <!-- =====================================
             MOTO
             
             FAIXA 2
        ====================================== -->

        <img
            src="motobike.png"
            class="moto"
            alt="Motocicleta">


        <!-- =====================================
             TÍTULO
        ====================================== -->

        <div class="titulo">

            <h1>
                Uma Noite na Cidade
            </h1>

            <p>
                Carro e motocicleta
            </p>

        </div>


        <!-- =====================================
             BOTÃO
        ====================================== -->

        <div class="controles">

            <button
                id="botao">

                Pausar

            </button>

        </div>


    </main>


    <script>

        const cena =
            document.querySelector(".cena");

        const botao =
            document.querySelector("#botao");


        botao.addEventListener(
            "click",
            function() {

                cena.classList.toggle(
                    "pausado"
                );


                if (
                    cena.classList.contains(
                        "pausado"
                    )
                ) {

                    botao.textContent =
                        "Continuar";

                } else {

                    botao.textContent =
                        "Pausar";

                }

            }
        );

    </script>


</body>
</html>
